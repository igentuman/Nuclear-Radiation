plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.k-4u.nl"
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        url = "https://modmaven.dev/"
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.ryanhcode.dev/releases" }
        }
        filter {
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            serverData()

            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (providers.gradleProperty('nrRunDirectory').isPresent()) {
                gameDirectory = file(providers.gradleProperty('nrRunDirectory').get())
            }
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// These unit tests exercise codecs and the optional mixin gate without booting
// Minecraft; ModDev attaches game/API libraries to main's compile classpath.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    implementation "curse.maven:jei-238222:9384706"

    implementation "curse.maven:kubejs-238086:9396057"
    implementation "curse.maven:better-advanced-tooltips-1637623:9148547"
    implementation "curse.maven:rhino-416294:8463898"

    implementation "curse.maven:applied-energistics-2-223794:9022271"
    implementation "curse.maven:guideme-1173950:9366331"

    implementation "curse.maven:curios-309927:8463519"
    implementation "curse.maven:the-one-probe-245211:8797594"

    implementation "curse.maven:megaton-nuclear-warfare-pro-edition-1713281:9072435"

    // Compile adapters without making NTM a required runtime dependency. Select
    // the development runtime with -PntmRuntime=none|core|space (default: space).
    compileOnly "curse.maven:ntm-continuum-1719328:9524061"
    compileOnly "curse.maven:ntm-continuum-space-1754149:9524268"
    compileOnly "curse.maven:golem-core-1719361:9523853"
    def ntmRuntime = providers.gradleProperty('ntmRuntime').getOrElse('space')
    if (!(ntmRuntime in ['none', 'core', 'space'])) {
        throw new GradleException('ntmRuntime must be none, core, or space')
    }
    if (ntmRuntime != 'none') {
        localRuntime "curse.maven:ntm-continuum-1719328:9524061"
        localRuntime "curse.maven:golem-core-1719361:9523853"
    }
    if (ntmRuntime == 'space') {
        localRuntime "curse.maven:ntm-continuum-space-1754149:9524268"
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

sourceSets.main.java {
    exclude 'igentuman/nr/integration/createnuclear/**'
    exclude 'igentuman/nr/integration/createnucleartech/**'
    exclude 'igentuman/nr/integration/emi/**'
    exclude 'igentuman/nr/integration/mekanism/**'
    exclude 'igentuman/nr/integration/nuclear_science/**'
    exclude 'igentuman/nr/integration/nuclearcraft/**'
    exclude 'igentuman/nr/integration/projectexplosive/**'
    exclude 'igentuman/nr/integration/sable/**'
    exclude 'igentuman/nr/integration/thewasteland/**'
    exclude 'igentuman/nr/mixin/**'
    exclude 'igentuman/nr/registry/NRGuide.java'
    exclude 'igentuman/nr/items/GuideBookItem.java'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata


idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
