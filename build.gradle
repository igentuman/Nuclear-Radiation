plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.k-4u.nl"
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        url = "https://modmaven.dev/"
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.ryanhcode.dev/releases" }
        }
        filter {
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// GameTest smoke suite: compiled against the main mod, shipped as the separate `nr_gametest` mod.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Test-only companion mod; loaded exclusively by the gameTestServer run.
        nr_gametest {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Smoke-test suite (src/gametest). Runs in its own game directory so the KubeJS fixture
        // scripts and the throwaway test world never touch the dev client's run/ folder.
        //   ./gradlew runGameTestServer                                  -> all tests
        //   ./gradlew runGameTestServer -Pgametests='nr_gametest:kubejs/*' -> filtered
        // Exit code = number of failed required tests; JUnit XML in build/reports/gametest/.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}", mods.nr_gametest]
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'nr_gametest'
            programArguments.addAll '--report', file('build/reports/gametest/nr-gametest.xml').getAbsolutePath()
            if (project.hasProperty('gametests')) {
                programArguments.addAll '--tests', project.property('gametests').toString()
            }
        }

        data {
            serverData()

            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge.addModdingDependenciesTo(sourceSets.gametest)

// Copy KubeJS fixture scripts into the isolated gametest game directory before each run.
// Sync also deletes stale scripts there, so the fixture set always matches src/gametest/kubejs.
def prepareGameTestKubeJS = tasks.register('prepareGameTestKubeJS', Sync) {
    from 'src/gametest/kubejs'
    into 'run-gametest/kubejs'
    preserve {
        include 'config/**'
        include 'assets/**'
        include 'data/**'
        include 'client_scripts/**'
        include 'README.txt'
    }
}
def gameTestReportDir = file('build/reports/gametest')
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestKubeJS
    doFirst { gameTestReportDir.mkdirs() }   // vanilla JUnit reporter crashes if the folder is missing
}


dependencies {
    implementation "curse.maven:jei-238222:9384706"

    implementation "curse.maven:kubejs-238086:9396057"
    implementation "curse.maven:better-advanced-tooltips-1637623:9148547"
    implementation "curse.maven:rhino-416294:8463898"

    implementation "curse.maven:applied-energistics-2-223794:9022271"
    implementation "curse.maven:guideme-1173950:9366331"

    implementation "curse.maven:curios-309927:8463519"
    implementation "curse.maven:the-one-probe-245211:8797594"

    implementation "curse.maven:megaton-nuclear-warfare-pro-edition-1713281:9072435"
}

sourceSets.main.java {
    exclude 'igentuman/nr/integration/createnuclear/**'
    exclude 'igentuman/nr/integration/createnucleartech/**'
    exclude 'igentuman/nr/integration/emi/**'
    exclude 'igentuman/nr/integration/mekanism/**'
    exclude 'igentuman/nr/integration/nuclear_science/**'
    exclude 'igentuman/nr/integration/nuclearcraft/**'
    exclude 'igentuman/nr/integration/projectexplosive/**'
    exclude 'igentuman/nr/integration/sable/**'
    exclude 'igentuman/nr/integration/thewasteland/**'
    exclude 'igentuman/nr/mixin/**'
    exclude 'igentuman/nr/registry/NRGuide.java'
    exclude 'igentuman/nr/items/GuideBookItem.java'
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
    gametestImplementation.extendsFrom(implementation)
    gametestRuntimeOnly.extendsFrom(runtimeOnly, localRuntime)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata


idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
